bio: |
  I am a PhD student at The Hong Kong Polytechnic University, supervised by Prof. Mengying Li. I develop forecasting methods that quantify uncertainty in renewable generation and help power system operators make better dispatch decisions. My work combines satellite imagery, weather forecasts, and physically guided generative models.

  From November 2025 to May 2026, I was an exchange PhD student in EPFL’s Wind Engineering and Renewable Energy Laboratory, supervised by Prof. Fernando Porté-Agel.
